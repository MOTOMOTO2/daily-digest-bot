[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-digest-bot"
version = "1.0.0"
description = "Collects items from RSS, JSON APIs and scraped pages, then posts one deduplicated digest a day to a chat channel."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    'tzdata>=2024.1 ; sys_platform == "win32"',
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
digest-bot = "digestbot.cli:main"

[tool.setuptools.packages.find]
include = ["digestbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
